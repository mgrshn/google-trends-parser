services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trends}
      POSTGRES_USER: ${POSTGRES_USER:-trends}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trends}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trends"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS} --log-level ${LOG_LEVEL}
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: ${REDIS_URL}
      DB_DSN: ${DB_DSN}
      API_KEY: ${API_KEY}
      WAIT_TIMEOUT_SEC: ${WAIT_TIMEOUT_SEC}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: >
      python worker.py
      --concurrency ${WORKER_CONCURRENCY}
      --rotating
      --sleep-min 0.5
      --sleep-max 0.5
      --redis ${REDIS_URL}
      --db ${DB_DSN}
    environment:
      REDIS_URL: ${REDIS_URL}
      DB_DSN: ${DB_DSN}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS}

  cleanup:
    build: .
    profiles: ["cleanup"]
    command: python scripts/cleanup.py
    environment:
      DB_DSN: ${DB_DSN}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - redis
      - postgres

volumes:
  redis_data:
  pg_data: