services:
  redis:
    image: redis:7-alpine
    # без host-порта: доступен только внутри docker-сети (api/worker ходят по имени redis)
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # без host-порта: доступен только внутри docker-сети
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # одноразовый прогон миграций: docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build: .
    profiles: ["tools"]
    command: python migrations/run.py
    environment:
      DB_DSN: ${DB_DSN}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS} --log-level ${LOG_LEVEL}
    ports:
      # наружу отдаётся только API. ОБЯЗАТЕЛЬНО задать API_KEY в .env.
      # если discovery на этом же сервере — можно сузить до "127.0.0.1:8000:8000"
      - "${API_BIND:-0.0.0.0}:8000:8000"
    environment:
      REDIS_URL: ${REDIS_URL}
      DB_DSN: ${DB_DSN}
      API_KEY: ${API_KEY}
      WAIT_TIMEOUT_SEC: ${WAIT_TIMEOUT_SEC}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      default: {}          # доступ к postgres/redis
      shared:               # discovery ходит сюда по имени 'parser'
        aliases:
          - parser

  worker:
    build: .
    command: >
      python worker.py
      --concurrency ${WORKER_CONCURRENCY}
      --rotating
      --sleep-min 0.5
      --sleep-max 0.5
      --redis ${REDIS_URL}
      --db ${DB_DSN}
    environment:
      REDIS_URL: ${REDIS_URL}
      DB_DSN: ${DB_DSN}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS}

  # чистка старых данных: docker compose -f docker-compose.prod.yml --profile tools run --rm cleanup
  cleanup:
    build: .
    profiles: ["tools"]
    command: python scripts/cleanup.py
    environment:
      DB_DSN: ${DB_DSN}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  pg_data:

networks:
  # создаётся один раз на сервере: docker network create shared
  # к ней же подключается discovery, чтобы ходить к парсеру по имени 'parser'
  shared:
    external: true